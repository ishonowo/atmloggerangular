<div>
  <div *ngIf="authService.hasRole('DISPLAY')">
    <h4>
      Click
      <a routerLink="/db-display" class="nav-link"><b>here</b></a> to see
      current information.
    </h4>
  </div>
  <div *ngIf="authService.hasRole('INSERT')">
    <h4>
      Click <a routerLink="/db-insert" class="nav-link"><b>here</b></a> to add
      information.
    </h4>
  </div>
  <div *ngIf="authService.hasRole('UPDATE')">
    <h4>
      Click <a routerLink="/db-update" class="nav-link"><b>here</b></a> to
      update information.
    </h4>
  </div>
</div>
