<div class="container mt-4">
  <div>
    <a routerLink="/db-display" class="nav-link return-link">Return</a>
  </div>

  <h2>ATM Faults List</h2>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="d-flex justify-content-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Data table -->
  <div *ngIf="!loading && !error" class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nature of Fault</th>
          <th>Description</th>
          <th>Fault Type</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-container *ngFor="let fault of faults; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ fault.natureOfFault }}</td>
          <td>{{ fault.description }}</td>
          <td>{{ fault.faultType }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- No data message -->
  <div *ngIf="faults.length === 0" class="alert alert-info">
    No faults found.
  </div>
</div>
