<div>
  <a routerLink="/db-insert" class="nav-link return-link">Return</a>
</div>

<div class="container-fluid">
  <form
    name="regionInsertForm"
    [formGroup]="regionInsertForm"
    (ngSubmit)="regionInsert()"
  >
    <div>
      <br />
      <div class="input">
        <label for="regionName"><b>Name: </b></label>
        <input
          id="regionName"
          formControlName="regionName"
          placeholder="Enter the name of the new region."
          title="regionName"
          type="text"
        />
        <ng-container
          *ngIf="
            regionInsertForm.get('regionName')?.invalid &&
            (regionInsertForm.get('regionName')?.touched ||
              regionInsertForm.get('regionName')?.dirty)
          "
        >
          <small
            *ngIf="regionInsertForm.get('regionName')?.errors?.['required']"
          >
            *The region name is required.</small
          >
        </ng-container>
      </div>
      <br />
    </div>
    <div class="display">
      <button
        type="submit"
        class="btn btn-success pull-left"
        [disabled]="!regionInsertForm.valid || loading"
      >
        <span>Submit Form</span>
      </button>
    </div>
  </form>
</div>
<div>
  <h2>Regions List</h2>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="d-flex justify-content-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Data table -->
  <div *ngIf="!loading && !error" class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Region Name</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let region of regions">
          <td>{{ region.id }}</td>
          <td>{{ region.regionName }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- No data message -->
  <div *ngIf="regions.length === 0" class="alert alert-info">
    No regions found.
  </div>
</div>
