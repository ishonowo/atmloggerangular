<div>
  <a routerLink="/db-update" class="nav-link return-link">Return</a>
</div>

<div class="container mt-4"></div>
<h2>ATM Fault List</h2>
<!-- Loading spinner -->
<div *ngIf="loading" class="d-flex justify-content-center">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- Error message -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<div class="row">
  <!-- Data table -->
  <div [class]="selectedFault ? 'col-md-8' : 'col-md-12'">
    <div *ngIf="!loading && !error" class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nature Of Fault</th>
            <th>Fault Description</th>
            <th>Fault Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let fault of faults; let i = index">
            <tr>
              <td>{{ i + 1 }}</td>
              <td>{{ fault.natureOfFault }}</td>
              <td>{{ fault.description }}</td>
              <td>{{ fault.faultType }}</td>
              <td>
                <button
                  class="btn btn-primary btn-sm"
                  (click)="onSelect(fault)"
                >
                  Edit
                </button>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>

      <!-- No data message -->
      <div *ngIf="faults.length === 0" class="alert alert-info">
        No vendors found.
      </div>
    </div>
    <!-- Update Form -->
  </div>
  <div *ngIf="selectedFault" class="col-md-4">
    <app-update-fault
      [fault]="selectedFault"
      (updateComplete)="onUpdateComplete()"
      (closeForm)="selectedFault = null"
    >
    </app-update-fault>
  </div>
</div>
