<div class="container mt-4" *ngIf="authService.hasRole('ADMIN')">
  <h2>Manage User Roles</h2>
  <h4>
    <a routerLink="/users">Return</a>
  </h4>
  <div *ngIf="loading" class="text-muted">Loading users...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="form-group mb-3" *ngIf="!loading">
    <label for="userSelect"><b>User</b></label>
    <select
      id="userSelect"
      class="form-control"
      [ngModel]="selectedUserId"
      (ngModelChange)="onUserChange($event)"
    >
      <option [ngValue]="null">
        All users (history) / select a user to edit
      </option>
      <option *ngFor="let u of users" [ngValue]="u.id">
        {{ u.fullName }} ({{ u.ldapCn }}){{ u.active ? "" : " - inactive" }}
      </option>
    </select>
  </div>

  <div *ngIf="selectedUser">
    <label>
      Roles <small class="text-muted">(click to add or remove)</small>
    </label>
    <div class="role-button-grid">
      <button
        type="button"
        *ngFor="let role of roles"
        class="btn btn-outline-primary role-btn"
        [class.active]="hasRole(role)"
        [disabled]="busyRoleId !== null"
        (click)="toggleRole(role)"
      >
        <span
          *ngIf="busyRoleId === role.id"
          class="spinner-border spinner-border-sm"
        ></span>
        {{ role.name }}:- {{ role.description }}
      </button>
    </div>
  
  </div>

</div>
