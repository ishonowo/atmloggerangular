<div class="container-fluid" *ngIf="authService.hasRole('ADMIN')">
  <div class="row">
    <div class="offset-3"></div>
    <div class="col-md-6">
      <form
        [formGroup]="userForm"
        (ngSubmit)="submitLoggedUser()"
        class="user-form"
      >
        <div class="form-group">
          <label for="ldapCn">User Cn</label>
          <input
            type="text"
            id="ldapCn"
            [class.is-invalid]="ldapCnControl.invalid && ldapCnControl.touched"
            class="form-control"
            formControlName="ldapCn"
            placeholder="Enter User Cn Name"
          />
          <div *ngIf="ldapCnControl.errors && ldapCnControl.touched">
            <small
              class="text-danger"
              *ngIf="ldapCnControl.errors?.['required']"
              >The cn name is a required field.</small
            >
          </div>
        </div>

        <!-- User Email -->
        <div class="form-group">
          <label for="email">User Email</label>
          <input
            type="text"
            id="email"
            [class.is-invalid]="emailControl.invalid && emailControl.touched"
            class="form-control"
            formControlName="email"
            placeholder="Enter User Email"
          />
          <div *ngIf="emailControl.errors && emailControl.touched">
            <small class="text-danger" *ngIf="emailControl.errors?.['required']"
              >The email is a required field.</small
            >
            <small class="text-danger" *ngIf="emailControl.errors?.['email']"
              >The email entered is invalid.</small
            >
          </div>
        </div>

        <!-- FullName -->
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            [class.is-invalid]="
              fullNameControl.invalid && fullNameControl.touched
            "
            class="form-control"
            formControlName="fullName"
            placeholder="Enter user's complete name"
          />
          <div *ngIf="fullNameControl.errors && fullNameControl.touched">
            <small
              class="text-danger"
              *ngIf="fullNameControl.errors?.['required']"
              >The full name is a required field.</small
            >
          </div>
        </div>

        <!-- Active -->
        <div>
          <div class="form-check form-check-inline">
            <label for="active">User Active</label>
            <input
              type="radio"
              id="active"
              [class.is-invalid]="
                activeControl.invalid && activeControl.touched
              "
              class="form-check-input"
              formControlName="active"
              placeholder="Is the user active?"
              [value]="true"
              checked
            />
          </div>
          <div class="form-check form-check-inline">
            <label for="active">User Inactive</label>
            <input
              type="radio"
              id="active"
              [class.is-invalid]="
                activeControl.invalid && activeControl.touched
              "
              class="form-check-input"
              formControlName="active"
              [value]="false"
            />
          </div>
        </div>

        <!-- Role(s) -->
        <div class="form-group">
          <label
            >Roles
            <small class="text-muted">(select all that apply)</small></label
          >

          <div *ngIf="rolesLoading" class="text-muted">
            Loading role list...
          </div>
          <div *ngIf="roleError" class="text-danger">{{ roleError }}</div>

          <div class="role-button-grid" *ngIf="!rolesLoading && !roleError">
            <button
              type="button"
              *ngFor="let role of roles"
              class="btn btn-outline-primary role-btn"
              [class.active]="isRoleSelected(role)"
              (click)="toggleRole(role)"
            >
              {{ role.name }}:- {{ role.description }}
            </button>
          </div>

          <small
            class="text-danger"
            *ngIf="userForm.touched && selectedRoles.length === 0"
          >
            Please select at least one role.
          </small>
        </div>
        <button
          [disabled]="userForm.invalid || !canSubmit || isClicked"
          type="submit"
          class="btn btn-success pull-right"
        >
          <i class="fa fa-envelope-o"></i>
          <span>Create User</span>
        </button>
      </form>
    </div>
  </div>
</div>
